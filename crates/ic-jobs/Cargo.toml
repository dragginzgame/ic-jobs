# Production packages: published scheduling library.
[package]
name = "ic-jobs"
version = "0.33.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"

# Keep the published scheduling model platform-neutral: Serde only, with no
# Candid, CDK, Memory or Timers dependency. Consumers own those integrations.
[dependencies]
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true
serde_test.workspace = true

[lints]
workspace = true
