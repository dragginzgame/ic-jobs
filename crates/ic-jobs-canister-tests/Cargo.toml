# Tests and tooling packages: native capture, recovery harness and local queue client.
[package]
name = "ic-jobs-canister-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build.workspace = true
ic-host-process.workspace = true

# Wire and PocketIC support recovery tests against the qualification canister;
# they are not dependencies of the published ic-jobs library or capture binary.
[dev-dependencies]
ctrlc.workspace = true
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-jobs-canister-test-support.workspace = true
ic-jobs-test-consumer.workspace = true
ic-platform = { workspace = true, features = ["pocket-ic", "principal-self-authenticating"] }
ic-testkit = { workspace = true, features = ["wire"] }
ic-wire.workspace = true
serde.workspace = true

[lints]
workspace = true
