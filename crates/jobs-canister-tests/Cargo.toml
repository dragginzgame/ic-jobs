# Tests and tooling packages: native capture binary and recovery harness.
[package]
name = "jobs-canister-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { workspace = true, features = ["std", "help", "usage", "error-context"] }
ic-build.workspace = true

# Candid and PocketIC support recovery tests against the qualification canister;
# they are not dependencies of the published ic-jobs library or capture binary.
[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["candid"] }
ic-testkit.workspace = true
ic-wire.workspace = true
jobs-test-consumer.workspace = true

[lints]
workspace = true
