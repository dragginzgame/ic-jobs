name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}
concurrency:
  # Preserve native qualification for each pushed commit, including queued jobs.
  # Superseded revisions of the same PR may still be cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare development and minimum toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
          source ci/tool-versions.env
          cargo install cargo-sort --version "$SHARED_TOOLING_CARGO_SORT_VERSION" --locked
          make install-host-tools
          make install-release-tools
      - name: Prepare reviewed IC tools
        run: make install-ic-tools
      - name: Check prepared IC tools offline
        run: make ic-tools-check
      - name: Prepare selected dependency cache
        run: cargo fetch --locked
      - name: Validate the selected graph
        run: make ci
      - name: Retain failed formatting and tool evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: jobs-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
