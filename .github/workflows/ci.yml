name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}
concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Prepare development and minimum toolchains
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup toolchain install 1.88.0 --profile minimal --target wasm32-unknown-unknown
      - name: Prepare the complete selected toolset
        run: make install-tools
      - name: Check prepared tools offline
        run: make tools-check
      - name: Prepare selected dependency cache
        run: cargo fetch --locked
      - name: Validate the selected graph
        run: make ci
      - name: Retain failed formatting and tool evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: jobs-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
