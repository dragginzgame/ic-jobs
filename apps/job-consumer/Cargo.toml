# Tests and tooling packages: qualification application, including its Wasm.
[package]
name = "jobs-test-consumer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Wasm-only runtime adapter for this unpublished test canister: entry points,
# caller identity, time, inter-canister calls, async execution and traps.
# All direct calls/macros live in src/canister.rs. This enters deployed test Wasm.
# The published ic-jobs library does not depend on ic-cdk.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Tests and tooling only
# CDK-generated entrypoints/service export require ::candid until Platform #1.
candid.workspace = true
ic-cdk.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# This unpublished qualification app owns IC integration. Platform supplies the
# Candid contract and bounded reply decoder without changing protocol or storage.
[dependencies]
# Tests and tooling only
ic-jobs.workspace = true
ic-memory = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["candid"] }
ic-timers.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# Tests and tooling only
ic-storage.workspace = true

[lints]
workspace = true
