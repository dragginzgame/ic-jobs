[workspace]
# Production packages: crates/ic-jobs.
# Tests and tooling packages: apps/job-consumer, crates/jobs-canister-tests.
members = ["apps/job-consumer", "crates/ic-jobs", "crates/jobs-canister-tests"]
default-members = ["crates/ic-jobs"]
resolver = "3"

[workspace.package]
version = "0.17.44"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Durable application job policies for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-jobs"

# Shared declarations are opt-in for each member, not dependencies of every crate.
# The published library uses only Serde at runtime. The qualification Wasm uses
# Wire; only native PocketIC tests transitively require Candid.
[workspace.dependencies]
# Production dependencies
serde = "1.0"

# Tests and tooling only
clap = { version = "4.6", default-features = false }
ctrlc = "3.5"
ic-build = "0.69.9"
ic-host-fs = { version = "0.69.9", default-features = false }
ic-host-process = { version = "0.69.9", default-features = false }
ic-jobs = { path = "crates/ic-jobs" }
ic-logging = { version = "0.17.1", default-features = false }
ic-memory = "0.54.0"
ic-metrics = { version = "0.17.1", default-features = false }
ic-platform = { version = "0.7.6", default-features = false }
ic-storage = "0.54.0"
ic-testkit = "0.69.9"
ic-testkit-native = "0.69.9"
ic-timers = "0.32.0"
ic-wire = "0.7.21"
jobs-test-consumer = { path = "apps/job-consumer" }
serde_json = "1.0"
serde_test = "1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
