[workspace]
# Production packages: crates/ic-jobs, crates/ic-timers.
# Remaining members are unpublished consumer, test and qualification packages.
members = [
    "apps/ic-jobs-test-consumer",
    "crates/ic-jobs",
    "crates/ic-jobs-canister-test-support",
    "crates/ic-jobs-canister-tests",
    "crates/ic-timers",
    "crates/ic-timers-pocketic",
    "crates/ic-timers-runtime-probe",
    "crates/ic-timers-size-probe",
    "crates/ic-timers-test-protocol",
]
default-members = ["crates/ic-jobs", "crates/ic-timers"]
resolver = "3"

[workspace.package]
version = "0.33.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Durable application job policies for Internet Computer canisters"
repository = "https://github.com/dragginzgame/ic-scheduling"

# Shared declarations are opt-in for each member, not dependencies of every crate.
# The Jobs library uses only Serde at runtime. The qualification Wasm uses
# Wire; only native PocketIC tests transitively require Candid.
[workspace.dependencies]
# Production dependencies
ic-metrics = { version = "0.21.0", default-features = false }
ic-platform = { version = "0.11.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Tests and tooling only
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
ctrlc = "3.5"
ic-build = "0.72.1"
ic-host-artifacts = "0.72.1"
ic-host-fs = { version = "0.72.1", default-features = false }
ic-host-process = { version = "0.72.1", default-features = false }
ic-jobs = { path = "crates/ic-jobs" }
ic-jobs-canister-test-support = { path = "crates/ic-jobs-canister-test-support" }
ic-jobs-test-consumer = { path = "apps/ic-jobs-test-consumer" }
ic-logging = { version = "0.21.0", default-features = false }
ic-memory = "0.58.0"
ic-storage = "0.58.0"
ic-testkit = "0.72.1"
ic-testkit-native = "0.72.1"
ic-timers = { path = "crates/ic-timers", version = "0.33.1" }
ic-timers-test-protocol = { path = "crates/ic-timers-test-protocol" }
ic-wire = "0.10.0"
serde_json = "1.0"
serde_test = "1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Preserve the Timers probes' qualified optimization profile.
[profile.timer-probe]
inherits = "release"
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
